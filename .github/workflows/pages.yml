name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'impl/js/**'
      - 'docs/**'
      - 'website/**'
      - 'spec/**'
      - 'conformance/coverage.md'
      - 'conformance/runner-protocol.md'
      - 'conformance/DASHBOARD.md'
      - 'conformance/README.md'
      - 'conformance/AUTHORING.md'
      - 'README.md'
      - 'README.ko.md'
      - 'PORTERS_GUIDE.md'
      - 'IMPLEMENTATIONS.md'
      - 'CONTRIBUTING.md'
      - 'RELEASING.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the Docusaurus sitemap plugin (lastmod: 'date')
          # can read git last-modified dates for every page.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Build the Docusaurus docs site at the root. The /converter page
      # imports the local dist via a webpack alias, so dist must exist
      # before docs:build runs (build step above produces it).
      - run: npm run docs:build
        env:
          # A repository *variable*, not a secret: `phc_` project keys are
          # public by design and only permit writes. Unset on forks, where the
          # site then builds with no analytics at all.
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
      - run: cp -R website/build/. site/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # v4 started excluding dotfiles from the artifact. `site/.nojekyll`
          # is a dotfile, so the default would drop it silently — the deploy
          # would still succeed and the file would just be gone. Keep v3
          # behavior explicitly. (.git and .github are excluded regardless.)
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
      # Ping IndexNow (Bing/Naver/Seznam/Yandex) with every sitemap URL
      # so changed pages are re-crawled right away. Only after a
      # successful deploy — submitting URLs the CDN doesn't serve yet
      # would get them crawled as 404s.
      - run: node website/scripts/indexnow-submit.mjs
